[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "client-feedback-triage"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "google-genai==2.24.0",
  "pydantic>=2.12.5,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.18.2,<2",
  "pytest>=8.4.2,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["feedback_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["feedback_triage", "main.py", "tests"]
